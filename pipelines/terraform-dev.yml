trigger:
  branches:
    include:
      - feature/terraform-architecture

pool:
  vmImage: ubuntu-latest

variables:
- group: terraform-dev-vars

- name: TF_VAR_public_key
  value: $(publicKey)

stages:

# ======================================
# Stage 1 - Terraform Validate
# ======================================

- stage: Validate
  displayName: Terraform Validate

  jobs:

  - job: TerraformValidate
    displayName: Validate Terraform Code

    steps:

    - checkout: self


    - task: Bash@3
      displayName: Install Terraform

      inputs:
        targetType: inline
        script: |
          wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
          unzip terraform_$(terraformVersion)_linux_amd64.zip
          sudo mv terraform /usr/local/bin/
          terraform version


    - task: AzureCLI@2
      displayName: Terraform Init

      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          cd $(workingDirectory)

          terraform init


    - task: Bash@3
      displayName: Terraform Format Check

      inputs:
        targetType: inline

        script: |

          cd $(workingDirectory)

          terraform fmt -check


    - task: AzureCLI@2
      displayName: Terraform Validate

      inputs:
        azureSubscription: $(serviceConnection)

        scriptType: bash

        scriptLocation: inlineScript

        inlineScript: |

          cd $(workingDirectory)

          terraform validate

    - task: AzureCLI@2
      displayName: Check Terraform Files

      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          cd $(workingDirectory)

          pwd

          ls -la


# ======================================
# Stage 2 - Terraform Plan
# ======================================

- stage: Plan

  displayName: Terraform Plan

  dependsOn: Validate


  jobs:

  - job: TerraformPlan

    displayName: Create Terraform Plan


    steps:


    - checkout: self


    - task: Bash@3
      displayName: Install Terraform


      inputs:

        targetType: inline

        script: |

          wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip

          unzip terraform_$(terraformVersion)_linux_amd64.zip

          sudo mv terraform /usr/local/bin/



    - task: AzureCLI@2

      displayName: Terraform Init


      inputs:

        azureSubscription: $(serviceConnection)

        scriptType: bash

        scriptLocation: inlineScript


        inlineScript: |

          cd $(workingDirectory)

          terraform init



- task: AzureCLI@2
  displayName: Terraform Plan

  inputs:
    azureSubscription: $(serviceConnection)
    scriptType: bash
    scriptLocation: inlineScript

    inlineScript: |
      set -x

      echo "===== Azure Login Successful ====="

      az account show

      echo "===== Current Directory ====="

      pwd

      echo "===== Change Directory ====="

      cd $(workingDirectory)

      pwd

      ls -la

      echo "===== Terraform Version ====="

      terraform version

      echo "===== Terraform Init ====="

      terraform init

      echo "===== Terraform Plan ====="

      terraform plan \
        -input=false \
        -no-color \
        -var-file="terraform.tfvars" \
        -var="public_key=$(publicKey)" \
        -out=tfplan

      echo "===== Plan Complete ====="


    - publish: $(workingDirectory)/tfplan

      artifact: terraform-plan




# ======================================
# Stage 3 - Terraform Apply
# ======================================


- stage: Apply

  displayName: Terraform Apply


  dependsOn: Plan



  jobs:


  - deployment: TerraformApply

    displayName: Apply Infrastructure


    environment: dev-approval


    strategy:


      runOnce:


        deploy:


          steps:



          - checkout: self



          - task: Bash@3

            displayName: Install Terraform


            inputs:

              targetType: inline

              script: |

                wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip

                unzip terraform_$(terraformVersion)_linux_amd64.zip

                sudo mv terraform /usr/local/bin/



          - download: current

            artifact: terraform-plan




          - task: AzureCLI@2

            displayName: Terraform Init


            inputs:

              azureSubscription: $(serviceConnection)

              scriptType: bash

              scriptLocation: inlineScript


              inlineScript: |

                cd $(workingDirectory)

                terraform init





          - task: AzureCLI@2

            displayName: Terraform Apply


            inputs:

              azureSubscription: $(serviceConnection)

              scriptType: bash

              scriptLocation: inlineScript


              inlineScript: |

                cd $(workingDirectory)

                terraform apply "$(Pipeline.Workspace)/terraform-plan/tfplan"
