trigger:
  branches:
    include:
      - feature/terraform-architecture


pool:
  vmImage: ubuntu-latest


variables:
- group: terraform-dev-vars


stages:

# ======================================
# Stage 1 - Terraform Validate
# ======================================

- stage: Validate

  displayName: Terraform Validate


  jobs:

  - job: TerraformValidate

    displayName: Validate Terraform Code


    steps:

    - checkout: self


    - task: Bash@3
      displayName: Install Terraform

      inputs:
        targetType: inline
        script: |
          wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
          unzip terraform_$(terraformVersion)_linux_amd64.zip
          sudo mv terraform /usr/local/bin/
          terraform version


    - task: AzureCLI@2
      displayName: Azure Login

      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az account show


    - task: Bash@3
      displayName: Terraform Init

      inputs:
        targetType: inline
        script: |
          cd $(workingDirectory)
          terraform init


    - task: Bash@3
      displayName: Terraform Format Check

      inputs:
        targetType: inline
        script: |
          cd $(workingDirectory)
          terraform fmt -check


    - task: Bash@3
      displayName: Terraform Validate

      inputs:
        targetType: inline
        script: |
          cd $(workingDirectory)
          terraform validate



# ======================================
# Stage 2 - Terraform Plan
# ======================================

- stage: Plan

  displayName: Terraform Plan

  dependsOn: Validate


  jobs:

  - job: TerraformPlan

    displayName: Create Terraform Plan


    steps:

    - checkout: self


    - task: Bash@3
      displayName: Install Terraform

      inputs:
        targetType: inline
        script: |
          wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
          unzip terraform_$(terraformVersion)_linux_amd64.zip
          sudo mv terraform /usr/local/bin/


    - task: AzureCLI@2
      displayName: Azure Login

      inputs:
        azureSubscription: $(serviceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az account show


    - task: Bash@3
      displayName: Terraform Init

      inputs:
        targetType: inline
        script: |
          cd $(workingDirectory)
          terraform init


    - task: Bash@3
      displayName: Terraform Plan

      inputs:
        targetType: inline
        script: |
          cd $(workingDirectory)
          terraform plan -out=tfplan


    - publish: $(workingDirectory)/tfplan
      artifact: terraform-plan



# ======================================
# Stage 3 - Terraform Apply
# ======================================

- stage: Apply

  displayName: Terraform Apply


  dependsOn: Plan


  jobs:

  - deployment: TerraformApply

    displayName: Apply Infrastructure


    environment: dev-approval


    strategy:

      runOnce:

        deploy:

          steps:


          - checkout: self


          - task: Bash@3

            displayName: Install Terraform

            inputs:
              targetType: inline
              script: |
                wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
                unzip terraform_$(terraformVersion)_linux_amd64.zip
                sudo mv terraform /usr/local/bin/


          - task: AzureCLI@2

            displayName: Azure Login

            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az account show


          - download: current

            artifact: terraform-plan



          - task: Bash@3

            displayName: Terraform Init

            inputs:
              targetType: inline
              script: |
                cd $(workingDirectory)
                terraform init



          - task: Bash@3

            displayName: Terraform Apply

            inputs:
              targetType: inline
              script: |
                cd $(workingDirectory)
                terraform apply "$(Pipeline.Workspace)/terraform-plan/tfplan"
